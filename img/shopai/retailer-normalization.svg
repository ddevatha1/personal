<svg viewBox="0 0 1180 460" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="normTitle normDesc">
  <title id="normTitle">Three integration strategies, one product shape</title>
  <desc id="normDesc">Kroger and Harris Teeter use a REST API with OAuth2, Aldi, Sprouts and Publix use GraphQL APIs, and Trader Joe's and Whole Foods use browser automation or server-rendered HTML. Every adapter normalizes its result into the same ApiProduct interface before anything downstream sees it.</desc>
  <defs>
    <marker id="normArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b86d4a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1180" height="460" fill="#fcf8f4"/>

  <text x="590" y="34" font-size="15" fill="#a89684" text-anchor="middle">Every store speaks a different protocol. Nothing above the adapter layer ever has to know that.</text>

  <!-- three source strategies -->
  <rect x="40" y="60" width="330" height="110" rx="12" fill="#ffffff" stroke="#e4d7c9" stroke-width="1.5"/>
  <text x="60" y="88" font-size="14" font-weight="700" fill="#1d1a17">REST + OAuth2</text>
  <text x="60" y="108" font-size="12" fill="#62574d">Kroger, Harris Teeter</text>
  <text x="60" y="128" font-size="11.5" fill="#8f4e31">client-credentials token,</text>
  <text x="60" y="144" font-size="11.5" fill="#8f4e31">official retailer API</text>

  <rect x="425" y="60" width="330" height="110" rx="12" fill="#ffffff" stroke="#e4d7c9" stroke-width="1.5"/>
  <text x="445" y="88" font-size="14" font-weight="700" fill="#1d1a17">GraphQL API</text>
  <text x="445" y="108" font-size="12" fill="#62574d">Aldi, Sprouts, Publix</text>
  <text x="445" y="128" font-size="11.5" fill="#8f4e31">anonymous session cookie,</text>
  <text x="445" y="144" font-size="11.5" fill="#8f4e31">store-scoped catalog query</text>

  <rect x="810" y="60" width="330" height="110" rx="12" fill="#ffffff" stroke="#e4d7c9" stroke-width="1.5"/>
  <text x="830" y="88" font-size="14" font-weight="700" fill="#1d1a17">Browser / SSR HTML</text>
  <text x="830" y="108" font-size="12" fill="#62574d">Trader Joe's, Whole Foods</text>
  <text x="830" y="128" font-size="11.5" fill="#8f4e31">Playwright session, or parse</text>
  <text x="830" y="144" font-size="11.5" fill="#8f4e31">the server-rendered page</text>

  <line x1="205" y1="170" x2="205" y2="210" stroke="#b86d4a" stroke-width="2" marker-end="url(#normArrow)"/>
  <line x1="590" y1="170" x2="590" y2="210" stroke="#b86d4a" stroke-width="2" marker-end="url(#normArrow)"/>
  <line x1="975" y1="170" x2="975" y2="210" stroke="#b86d4a" stroke-width="2" marker-end="url(#normArrow)"/>

  <!-- normalization funnel -->
  <path d="M205,210 L975,210 L700,258 L480,258 Z" fill="#fbeee4" stroke="#b86d4a" stroke-width="1.5"/>
  <text x="590" y="240" font-size="13" font-weight="700" fill="#8f4e31" text-anchor="middle">Each adapter maps its own raw reply into the same shape</text>

  <line x1="590" y1="258" x2="590" y2="296" stroke="#b86d4a" stroke-width="2" marker-end="url(#normArrow)"/>

  <!-- ApiProduct shape -->
  <rect x="300" y="300" width="580" height="130" rx="12" fill="#ffffff" stroke="#b86d4a" stroke-width="1.5"/>
  <text x="590" y="326" font-size="15" font-weight="700" fill="#1d1a17" text-anchor="middle">ApiProduct</text>
  <text x="590" y="346" font-size="12" fill="#62574d" text-anchor="middle">the one interface every downstream consumer trusts</text>
  <g font-size="11.5" font-family="'Courier New', Courier, monospace" fill="#4a3f36">
    <text x="330" y="374">name</text><text x="470" y="374">price</text><text x="600" y="374">store</text><text x="710" y="374">imageUrl</text>
    <text x="330" y="396">size</text><text x="470" y="396">rating</text><text x="600" y="396">productUrl</text><text x="770" y="396">nutrition?</text>
  </g>
  <text x="590" y="418" font-size="11" fill="#a89684" text-anchor="middle">searchService, comparisonService, shoppingPlanOptimizer all read only this shape &#8212; never a store-specific field</text>
</svg>
